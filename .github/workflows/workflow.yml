name: Build and deploy static site
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Checkout LogLifted (for web)
        uses: actions/checkout@v4
        with:
          repository: sergkondr/loglifted
          ref: main
          path: _loglifted
          sparse-checkout: web
          token: ${{ secrets.LOGLIFTED_TOKEN }}

      - name: Stage LogLifted site
        run: |
          mkdir -p static/loglifted
          cp -R _loglifted/web/. static/loglifted/

      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@v0.20.0
        env:
          PAGES_BRANCH: gh-pages
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
