name: Build and deploy static site
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Checkout LogLifted (for webui)
        uses: actions/checkout@v4
        with:
          repository: sergkondr/loglifted
          ref: main
          path: _loglifted
          sparse-checkout: webui
          token: ${{ secrets.LOGLIFTED_TOKEN }}

      - name: Stage Plan Builder
        run: |
          mkdir -p static/plan-builder
          cp _loglifted/webui/*.{html,js,css} static/plan-builder/

      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@v0.20.0
        env:
          PAGES_BRANCH: gh-pages
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
